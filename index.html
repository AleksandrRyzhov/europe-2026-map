<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Europe 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Europe 2026</h1>
    <p class="sub">Минск → Гродно → Европа → Минск</p>
    <div class="legend"><span><i class="dot" style="background:#16a34a"></i>отели</span><span><i class="dot" style="background:#7c3aed"></i>POI</span><span><i class="dot" style="background:#ea580c"></i>дни</span></div>
    <nav class="tabs">
      <button class="tab active" data-tab="map" type="button">Карта</button>
      <button class="tab" data-tab="hotels" type="button">Жильё</button>
      <button class="tab" data-tab="routes" type="button">Маршруты</button>
      <button class="tab" data-tab="pois" type="button">Точки</button>
      <button class="tab" data-tab="stops" type="button">Еда/бак</button>
      <button class="tab" data-tab="docs" type="button">Документы</button>
      <button class="tab" data-tab="phrases" type="button">Фразы</button>
      <button class="tab" data-tab="services" type="button">Службы</button>
      <button class="tab" data-tab="info" type="button">Важно</button>
    </nav>
    <div id="online" class="online">…</div>
  </header>
  <main class="content">
    <section id="tab-map" class="panel map-panel active"><div id="map"></div></section>
    <section id="tab-hotels" class="panel"><div id="hotels"></div></section>
    <section id="tab-routes" class="panel"><div id="routes"></div></section>
    <section id="tab-pois" class="panel"><div id="pois"></div></section>
    <section id="tab-stops" class="panel"><div id="stops"></div></section>
    <section id="tab-docs" class="panel"><div id="docs"></div></section>
    <section id="tab-phrases" class="panel"><div id="phrases"></div></section>
    <section id="tab-services" class="panel"><div id="services"></div></section>
    <section id="tab-info" class="panel"><div id="info"></div></section>
  </main>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="data.js?v=27"></script>
<script src="app.js?v=27"></script>
</body>
</html>
